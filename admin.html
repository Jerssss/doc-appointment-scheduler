<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo | Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Medi<span>Ko</span></div>
        <div class="nav-right">
            <a href="login.html" class="logout-btn">Logout</a>
        </div>
    </nav>


    <!-- Dashboard -->
    <section class="dashboard">
        <h2>Admin Dashboard</h2>
        <div class="card-container">
            <div class="card add">
                <h3>Add Account</h3>
                <p>Create new user accounts.</p>
                <a href="#" class="card-btn" id="addAccount">Go</a>
            </div>
            <div class="card view">
                <h3>View Accounts</h3>
                <p>Browse all registered users.</p>
                <a href="#" class="card-btn" id="viewAccounts">Go</a>
            </div>
            <div class="card edit">
                <h3>Edit Accounts</h3>
                <p>Modify existing user information.</p>
                <a href="#" class="card-btn">Go</a>
            </div>
            <div class="card delete">
                <h3>Delete Accounts</h3>
                <p>Remove user accounts safely.</p>
                <a href="#" class="card-btn">Go</a>
            </div>
        </div>
    </section>


    <footer>
        <p>&copy; MediKo 2025. All Rights Reserved.</p>
    </footer>

    <script src="js/admin.js"></script>
</body>
</html>
