<!-- ===== BOOKING CONTAINER ===== -->
<main class="booking-container">
    <!-- Doctor Card -->
    <div class="doctor-card">
        <div class="doctor-image">
            <img id="doctorImage" src="" alt="Doctor Picture">
        </div>
        <h3 id="doctorSpecialty" class="doctor-specialty"></h3>
        <h2 id="doctorName" class="doctor-name"></h2>
        <p id="doctorMessage" class="doctor-message"></p>
    </div>

    <!-- Booking Form -->
    <div class="booking-form-card">
        <h3 class="form-title">Please input the required * fields</h3>

        <form id="bookingForm">
            <!-- Consultation Type -->
            <div class="form-group">
                <label>Choose type of consultation</label>
                <div class="button-group">
                    <button type="button" class="toggle-btn active" data-type="virtual">Virtual</button>
                    <button type="button" class="toggle-btn" data-type="home">Home Visit</button>
                    <button type="button" class="toggle-btn" data-type="f2f">F2F Meet</button>
                </div>
            </div>

            <!-- Schedule -->
            <div class="form-group">
                <label>Choose a schedule*</label>
                <div class="input-with-icon">
                    <input type="datetime-local" id="schedule" required>
                    <span class="input-icon">📅</span>
                </div>
                <small class="help-text">Example: 11/14/2025 11:00 AM/PM</small>
                <small class="help-text">Note: Time will be rounded up to the nearest 30 minutes.</small>
            </div>

            <!-- Reason for Checkup -->
            <div class="form-group">
                <label>State reasons for checkup*</label>
                <textarea id="reason" rows="4" required placeholder="Enter your reasons here..."></textarea>
            </div>

            <!-- More Patient Information -->
            <div class="form-group">
                <label>Age*</label>
                <input type="number" id="age" placeholder="Enter your age" min="0" required>
            </div>
            
            <div class="form-group">
                <label>Gender*</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select your gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Address*</label>
                <textarea id="address" rows="2" placeholder="Enter your address" required></textarea>
            </div>
            
            <div class="form-group">
                <label>Temperature (°C)</label>
                <input type="number" id="temperature" placeholder="Enter body temperature" step="0.1">
            </div>
            
            <div class="form-group">
                <label>Blood Pressure (mmHg)</label>
                <input type="text" id="blood_pressure" placeholder="e.g., 120/80">
            </div>
            
            <div class="form-group">
                <label>Heart Rate (bpm)</label>
                <input type="number" id="heart_rate" placeholder="Enter heart rate">
            </div>
            
            <div class="form-group">
                <label>Height & Weight</label>
                <input type="text" id="height_weight" placeholder="e.g., 170 cm / 65 kg">
            </div>

            <!-- Current Prescriptions -->
            <div class="form-group">
                <label>Any current prescriptions? If none, leave this blank...</label>
                <textarea id="prescriptions" rows="4" placeholder="List any current medications or prescriptions..."></textarea>
            </div>

            <!-- Form Buttons -->
            <div class="form-actions">
                <button type="button" class="btn btn-cancel">Cancel</button>
                <button type="submit" class="btn btn-confirm">Confirm</button>
            </div>
        </form>
    </div>
</main>
