<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediKo | Doctor Dashboard</title>
  <link rel="stylesheet" href="css/style_doc.css" />
  <link rel="stylesheet" href="css/doctor_appointment_list.css" />
</head>
<body>
  <!-- ===== NAVBAR ===== -->
  <header>
    <div class="logo">
      <span class="blue">Medi</span><span class="pink">Ko</span>
    </div>

    <nav>
      <a href="wala pa">Consultations</a>
      <a class="active" href="doctor_appointment_list.html">My Appointments</a>
      <a href="patient_records.html">Patient Profile</a>
    </nav>

    <div class="icons">
      <a href="user_doctor_profile.html" class="icon-btn notification-btn">
        <img src="images/notification.png" alt="Notification Bell" class="notif-img">
      </a>
      <a href="user_doctor_profile.html" class="icon-btn profile-btn">
        <img src="images/user.png" alt="Profile" class="profile-img">
      </a>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Hello, Dr. Taejin</h2>
      <h4>Upcoming Appointments</h4>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search patient..." />
      </div>

      <div class="appointment-list" id="appointmentList"></div>

    </div>

    <!-- Patient Info -->
    <div class="patient-details">
      <div class="patient-header">
          <div class="left-side">
              <img src="images/default-patient.png" alt="Patient Image" />
              <div class="info">
                  <h3 id="patientName">Loading...</h3>
                  <p id="patientAge">-</p>
                  <p id="patientGender">-</p>
                  <p id="patientAddress">-</p>
              </div>
          </div>

          <button class="patient-info-btn">See Patient Info →</button>
      </div>

      <div class="vitals-container">
        <h3>Vitals</h3>
        <div class="vitals">
          <div class="vital-box">
            <label>Temperature</label>
            <input type="text" id="vitalTemp" value="-" readonly />
          </div>
          <div class="vital-box">
            <label>Blood Pressure</label>
            <input type="text" id="vitalBP" value="-" readonly />
          </div>
          <div class="vital-box">
            <label>Heart Rate</label>
            <input type="text" id="vitalHR" value="-" readonly />
          </div>
          <div class="vital-box">
            <label>Height and Weight</label>
            <input type="text" id="vitalHW" value="-" readonly />
          </div>
        </div>
      </div>

      <div class="start-consultation-container">
        <button class="start-consultation-btn">Start Consultation</button>
      </div>

      
    </div>
  </div>

  <!-- footer -->
  <footer class="site-footer">
    <div class="social-icons">
      <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="images/google.png" alt="Google"></a>
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="news.html">Book</a></li>
      <li><a href="about.html">History</a></li>
      <li><a href="team.html">About Us</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Team T. Arc</span></p>
  </footer>

  <!-- JS -->
  <script src="js/doctor_appointments.js"></script>
</body>
</html>
