<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation History | MediKo</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared + Page CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
</head>

<body>
  <!-- ===== NAVBAR ===== -->
  <header>
    <div class="logo">
      <span class="blue">Medi</span><span class="pink">Ko</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="list_of_doctors.html">Book</a>
      <a href="history.html">History</a>
      <a href="aboutus.html">About Us</a>
    </nav>

    <div class="icons">
      <a href="history.html" class="icon-btn notification-btn">
        <img src="images/notification.png" alt="Notifications" class="notif-img">
      </a>
      <a href="user_patient_profile.html" class="icon-btn profile-btn">
        <img src="images/user.png" alt="Profile" class="profile-img">
      </a>
    </div>
  </header>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="history-container">
    <h1>Consultation History</h1>

    <div class="history-box">
      <!-- Upcoming Consultations -->
      <div class="section" id="upcoming-section">
        <h2>Upcoming</h2>
        <div id="upcoming-cards">
          <!-- JS will inject upcoming consultation cards here -->
          <p>Loading upcoming consultations...</p>
        </div>
      </div>

      <!-- Past Consultations -->
      <div class="section" id="past-section">
        <h2>Past Consultations</h2>
        <p class="subtext">Your completed appointments</p>
        <div id="past-cards">
          <!-- JS will inject past consultation cards here -->
          <p>Loading past consultations...</p>
        </div>
      </div>
      <div id="historyContainer"></div>
    </div>
  </main>

  <!-- ===== RATE MODAL ===== -->
<div id="rateModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>

    <h2>Rate Consultation</h2>

    <div class="star-container">
      <span class="star" data-value="1">&#9733;</span>
      <span class="star" data-value="2">&#9733;</span>
      <span class="star" data-value="3">&#9733;</span>
      <span class="star" data-value="4">&#9733;</span>
      <span class="star" data-value="5">&#9733;</span>
    </div>

    <button class="submit-rating">Submit</button>
  </div>
</div>


  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="social-icons">
      <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="images/google.png" alt="Google"></a>
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="list_of_doctors.html">Book</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="aboutus.html">About Us</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Team T. Arc</span></p>
  </footer>

  <!-- ===== JS ===== -->
  <script src="js/frontend_js/history.js"></script>
</body>
</html>
