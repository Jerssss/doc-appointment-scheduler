<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <header>
        <div class="logo">
            <span class="blue">Medi</span><span class="pink">Ko</span>
        </div>
    </header>

    <!-- ===== LOGIN SECTION ===== -->
    <section class="login-container">
        <div class="login-card">
            <h2>Login to MediKo</h2>

            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="Enter your email">

            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="Enter your password">

            <div class="links-row">
                <span>New user? <a href="register.html">Register here!</a></span>
            </div>

            <button id="login-btn" class="login-btn">Log In</button>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="social-icons">
    <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
    <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
    <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
    <a href="#"><img src="images/google.png" alt="Google"></a>
    <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
  </div>

  <ul class="footer-nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="list_of_doctors.html">Book</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="aboutus.html">About Us</a></li>
  </ul>

  <p class="footer-copy">Copyright ©2025 | Designed by <span>Team T. Arc</span></p>
</footer>

    <script src="js/login.js"></script>
</body>
</html>
