<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Medi<span>Ko</span></div>
    <div class="icons">
        <div class="icon-circle"></div>
        <div class="icon-user"></div>
    </div>
</header>

<section class="login-container">
    <div class="login-card">
        <h2>Login to MediKo</h2>

        <label>Email</label>
        <input id="login-email" type="email" placeholder="Enter your email">

        <label>Password</label>
        <input id="login-password" type="password" placeholder="Enter your password">

        <div class="links-row">
            <span>New user? <a href="register.html">Click here to register!</a></span>
        </div>

        <button id="login-btn" class="login-btn">Log in</button>
    </div>
</section>

<footer>
    <div class="footer-brand">MediKo</div>
    <p>
        Lorem ipsum dolor sit amet consectetur adipiscing elit. 
        Quisque facilisis ex sapien vitae pellentesque sem placerat.
        In id cursus mi pretium tellus odio convallis.
    </p>

    <div class="socials">
        <div class="circle">F</div>
        <div class="circle">T</div>
        <div class="circle">I</div>
    </div>

    <div class="copyright">© Your Company 2022. We love you!</div>
</footer>

<script src="js/login.js"></script>
</body>
</html>
