<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediKo</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/payment_gateway.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<!-- ===== NAVBAR ===== -->
<header>
  <div class="logo">
    <span class="blue">Medi</span><span class="pink">Ko</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="list_of_doctors.html">Book</a>
    <a href="history.html">History</a>
    <a href="aboutus.html">About Us</a>
  </nav>

  <div class="icons">
    <a href="notifications.html" class="icon-btn notification-btn">
      <img src="images/notification.png" alt="Notifications" class="notif-img">
    </a>

    <a href="user_patient_profile.html" class="icon-btn profile-btn">
      <img src="images/user.png" alt="Profile" class="profile-img">
    </a>
  </div>
</header>

<!-- Payment Gateway Section -->
<main class="payment-container">
    <div class="payment-card">
        <h2 class="payment-title">Select Payment Method</h2>

        <!-- Payment Method Tabs -->
        <div class="payment-tabs">
            <button class="tab-btn active" data-method="gcash">GCash</button>
            <button class="tab-btn" data-method="cash">Cash</button>
        </div>

        <!-- Payment Content -->
        <div class="payment-content">
            <!-- Left Side: Form Fields -->
            <div class="payment-form">

                <!-- Dynamic Fields -->
                <div class="form-field">
                    <label>Full Name</label>
                    <input type="text" id="fullName" readonly>
                </div>

                <div class="form-field">
                    <label>Username</label>
                    <input type="text" id="username" readonly>
                </div>

                <div class="form-field">
                    <label>Email</label>
                    <input type="email" id="email" readonly>
                </div>

                <div class="form-field">
                    <label>Appointment Time</label>
                    <input type="text" id="appointmentTime" readonly>
                </div>

                <div class="form-field">
                    <label>Appointment Type</label>
                    <input type="text" id="appointmentType" readonly>
                </div>

                <div class="form-field" id="gcashUploadField">
                    <label>Upload GCash Screenshot</label>
                    <input type="file" id="gcashFile" accept="image/*">
                </div>

                <button class="btn-confirm" id="confirmPayment">Confirm</button>
            </div>

            <!-- Right Side: QR Code & Doctor -->
            <div class="qr-section">
                <div class="qr-code">
                    <img src="images/default-qr.png" alt="QR Code" id="qrCodeImage">
                </div>
                <p class="qr-number" id="qrNumber">---</p>
                <p class="qr-doctor" id="doctorName">---</p>
            </div>
        </div>
    </div>
</main>

<!-- Footer Section -->
<footer class="site-footer">
    <div class="social-icons">
        <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="images/google.png" alt="Google"></a>
        <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>
    <ul class="footer-nav">

        <li><a href="list_of_doctors.html">Book</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="aboutus.html">About Us</a></li>
    </ul>
    <p class="footer-copy">Copyright ©2025 | Designed by <span>Team T. Arc</span></p>
</footer>

<!-- JS -->
<script src="js/frontend_js/payment_gateway.js"></script>

</body>
</html>
