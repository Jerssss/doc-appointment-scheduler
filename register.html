<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo Registration</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Medi<span>Ko</span></div>
    <div class="icons">
        <div class="icon-circle"></div>
        <div class="icon-user"></div>
    </div>
</header>

<section class="register-container">
    <div class="register-card">
        <h2>Create Your Account</h2>

        <label>Username</label>
        <input id="reg-username" type="text" placeholder="Enter your username">

        <label>Contact Number</label>
        <input id="reg-contact" type="text" placeholder="Enter your contact number">

        <label>Email</label>
        <input id="reg-email" type="email" placeholder="Enter your email">

        <label>Address</label>
        <input id="reg-address" type="text" placeholder="Enter your address">

        <label>Password</label>
        <input id="reg-password" type="password" placeholder="Create a password">

        <label>Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Re-enter your password">

        <div class="button-row">
            <button id="cancel-btn" class="cancel-btn">Cancel</button>
            <button id="register-btn" class="register-btn">Register</button>
        </div>
    </div>
</section>

<script src="js/register.js"></script>
</body>
</html>
