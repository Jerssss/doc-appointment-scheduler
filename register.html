<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo Registration</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Medi<span>Ko</span></div>
    <div class="icons">
        <div class="icon-circle"></div>
        <div class="icon-user"></div>
    </div>
</header>

<section class="register-container">
    <div class="register-card">
        <h2>Create Your Patient Account</h2>

        <!-- User Info -->
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" placeholder="Enter your username">

        <label for="reg-fullname">Full Name</label>
        <input id="reg-fullname" type="text" placeholder="Enter your full name">

        <label for="reg-dob">Date of Birth</label>
        <input id="reg-dob" type="date">

        <label for="reg-sex">Sex</label>
        <select id="reg-sex">
            <option value="">Select Sex</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="reg-contact">Contact Number</label>
        <input id="reg-contact" type="text" placeholder="Enter your contact number">

        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="Enter your email">

        <label for="reg-address">Address</label>
        <input id="reg-address" type="text" placeholder="Enter your address">

        <!-- Emergency Contact -->
        <h3>Emergency Contact</h3>

        <label for="reg-emergency-name">Name</label>
        <input id="reg-emergency-name" type="text" placeholder="Enter emergency contact name">

        <label for="reg-emergency-relationship">Relationship</label>
        <input id="reg-emergency-relationship" type="text" placeholder="Relationship to you">

        <label for="reg-emergency-phone">Phone</label>
        <input id="reg-emergency-phone" type="text" placeholder="Enter emergency contact phone">

        <!-- Password -->
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="Create a password">

        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Re-enter your password">

        <!-- Buttons -->
        <div class="button-row">
            <button id="cancel-btn" class="cancel-btn">Cancel</button>
            <button class="register-btn">Register</button>
        </div>
    </div>
</section>

<script src="js/register.js"></script>
</body>
</html>
