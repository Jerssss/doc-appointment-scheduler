<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKo | Doctor Details</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/book.css">
    <link rel="stylesheet" href="css/view_doctor.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="logo">
    <span class="blue">Medi</span><span class="pink">Ko</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="list_of_doctors.html">Book</a>
    <a href="history.html">History</a>
    <a href="aboutus.html">About Us</a>
  </nav>

  <div class="icons">
    <a href="notifications.html" class="icon-btn notification-btn">
      <img src="images/notification.png" alt="Notifications" class="notif-img">
    </a>

    <a href="user_patient_profile.html" class="icon-btn profile-btn">
      <img src="images/user.png" alt="Profile" class="profile-img">
    </a>
  </div>
</header>

<!-- Dynamic Doctor Info -->
<div class="doctor-info-container">
    <div class="profile-card" id="doctorProfile"></div>

    <div class="details" id="hospitalDetails"></div>

    <!-- Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>CONFIRMATION</h2>
            <p id="confirmText"></p>
            <div class="modal-buttons">
                <button class="cancel-btn">Cancel</button>
                <button class="confirm-btn" id="confirmBookingBtn">Confirm</button>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer">
    <div class="social-icons">
        <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="images/google.png" alt="Google"></a>
        <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="news.html">Book</a></li>
        <li><a href="about.html">History</a></li>
        <li><a href="team.html">About Us</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Team T. Arc</span></p>
</footer>

<script>
// Load doctor data from localStorage
document.addEventListener("DOMContentLoaded", function () {
    const doctor = JSON.parse(localStorage.getItem("selectedDoctor"));

    if (!doctor) {
        alert("No doctor selected.");
        window.location.href = "book.html";
        return;
    }

    document.getElementById("doctorProfile").innerHTML = `
        <img src="${doctor.profile_image}">
        <p class="title">${doctor.hospital_title}</p>
        <h2>${doctor.full_name}</h2>
        <p><span>Titles:</span> ${doctor.titles}</p>
        <p><span>Specialization:</span> ${doctor.specialization}</p>
        <p><span>Fee:</span> ₱${doctor.fee}</p>
        <p><span>Languages:</span> ${doctor.languages}</p>
        <p class="rating">⭐ ${doctor.rating} / 5 (${doctor.reviews} reviews)</p>
        <p><span>Services:</span> ${doctor.services}</p>
    `;

    document.getElementById("hospitalDetails").innerHTML = `
        <img src="${doctor.hospital_image}">
        <p><b>Hospital:</b> ${doctor.hospital_name}</p>
        <p><b>Phone:</b> ${doctor.hospital_phone}</p>
        <p><b>Address:</b> ${doctor.hospital_address}</p>
        <p><b>Clinic Hours:</b> ${doctor.clinic_hours}</p>
        <button id="bookBtn">Book Me</button>
    `;

    const modal = document.getElementById("confirmationModal");

    document.getElementById("bookBtn").onclick = () => {
        document.getElementById("confirmText").textContent =
            "You are booking " + doctor.full_name;
        modal.style.display = "block";
    };

    document.querySelector(".close").onclick =
        () => modal.style.display = "none";

    document.querySelector(".cancel-btn").onclick =
        () => modal.style.display = "none";

    document.getElementById("confirmBookingBtn").onclick = () => {
        window.location.href = "booking_details.html";
    };
});
</script>

</body>
</html>
